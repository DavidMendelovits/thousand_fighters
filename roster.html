<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14121c">
<title>Roster · Thousand Fighters</title>
<style>
  :root { --bg: #14121c; --panel: #1e1b2b; --line: #332e47; --text: #ece8f5; --dim: #9a93b3; --gold: #ffd23f; --bad: #ff6b5a; --good: #5fe08a; --pad: 16px; }
  * { box-sizing: border-box; } [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; overflow-x: hidden; }
  body.lock { overflow: hidden; }
  button, input { font: inherit; color: var(--text); }
  button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  small, .dim { color: var(--dim); }
  .ok { color: var(--good); } .bad { color: var(--bad); }

  /* ---- roster ---- */
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
    padding: calc(10px + env(safe-area-inset-top)) var(--pad) 10px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; }
  .bar b { font-size: 16px; letter-spacing: .12em; color: var(--gold); }
  .bar a { color: var(--dim); font-size: 13px; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; }
  #search { width: 100%; margin-top: 8px; height: 44px; padding: 0 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; font-size: 16px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; padding: 12px var(--pad) calc(24px + env(safe-area-inset-bottom)); }
  .card { display: flex; flex-direction: column; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .card:active { border-color: var(--gold); }
  .card canvas { display: block; width: 100%; aspect-ratio: 5 / 6; background: radial-gradient(ellipse at 50% 85%, #2c2540, transparent 70%); }
  .card .nm { padding: 6px 8px 0; font-weight: 700; font-size: 13px; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  .card .meta { padding: 2px 8px 8px; font-size: 11px; color: var(--dim); }
  .tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #14121c; background: var(--gold); border-radius: 4px; padding: 1px 5px; vertical-align: 1px; }
  #empty { padding: 32px var(--pad); text-align: center; }

  /* ---- detail ---- */
  /* the game window stays put; only the move list under it scrolls */
  #detail { position: fixed; inset: 0; z-index: 5; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
  #detail header { position: static; flex: none; display: flex; align-items: center; gap: 4px; padding-left: 4px; }
  #back { width: 44px; height: 44px; display: grid; place-items: center; font-size: 22px; border-radius: 10px; flex: none; }
  #dname { font-size: 18px; font-weight: 800; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #dbadge { margin-left: auto; font-size: 12px; font-weight: 700; white-space: nowrap; padding-right: 8px; }
  .stage { flex: none; width: 100%; max-width: 720px; margin: 0 auto; padding: 0 var(--pad) 8px; }
  #arena { display: block; width: min(100%, calc(42vh * 16 / 9)); width: min(100%, calc(42dvh * 16 / 9)); aspect-ratio: 16 / 9; margin: 12px auto 0; border-radius: 10px; border: 1px solid var(--line); background: #000; }
  .under { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  #now { flex: 1; min-width: 0; min-height: 22px; margin: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #solo { flex: none; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: 13px; font-weight: 700; white-space: nowrap; }
  #solo[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; border-top: 1px solid var(--line); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 var(--pad) calc(32px + env(safe-area-inset-bottom)); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0 4px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 6px; text-align: center; }
  .stat b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 22px 0 6px; font-weight: 700; }
  details > summary { list-style: none; cursor: pointer; min-height: 44px; display: flex; align-items: center; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary h2 { margin: 0; } details > summary::after { content: '▸'; margin-left: 8px; color: var(--dim); } details[open] > summary::after { content: '▾'; }
  .bio { color: var(--dim); white-space: pre-line; margin: 0; }
  .list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .mv { display: block; width: 100%; min-height: 52px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .mv:last-child { border-bottom: 0; }
  .mv.on { box-shadow: inset 3px 0 0 var(--gold); background: #262236; }
  .mv[disabled] { cursor: default; }
  .mv .top { display: flex; gap: 8px; align-items: baseline; }
  .mv .top b { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .mv .cmd { font: 13px ui-monospace, monospace; color: var(--gold); text-align: right; flex: none; max-width: 55%; overflow-wrap: anywhere; }
  .mv .sub { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .checks { margin: 6px 0 0; padding: 0; list-style: none; font-size: 13px; }
  .checks li { padding: 4px 0; }
</style>
</head>
<body>
<header>
  <div class="bar"><b>THOUSAND FIGHTERS</b><a href="/">Studio ›</a></div>
  <div class="bar"><span id="count" class="dim">Loading roster…</span></div>
  <input id="search" type="search" placeholder="Search fighters" aria-label="Search fighters" autocomplete="off">
</header>
<main id="grid" aria-label="Fighters"></main>
<p id="empty" class="dim" hidden></p>

<section id="detail" hidden aria-modal="true" role="dialog" aria-labelledby="dname">
  <header>
    <button id="back" aria-label="Back to roster">‹</button>
    <span id="dname"></span><span id="dbadge"></span>
  </header>
  <div class="stage">
    <canvas id="arena" width="960" height="540"></canvas>
    <div class="under">
      <p id="now" class="dim"></p>
      <button id="solo" aria-pressed="false">Hide opponent</button>
    </div>
  </div>
  <div class="scroll" id="scroll">
    <div class="wrap">
      <div class="stats" id="stats"></div>
      <div id="body"></div>
    </div>
  </div>
</section>
<script type="module" src="./roster.ts"></script>
</body>
</html>
